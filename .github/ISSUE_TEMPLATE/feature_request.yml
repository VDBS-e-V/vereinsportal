name: Funktion vorschlagen
description: Neue Funktion oder Verbesserung vorschlagen
title: "[Feature]: "
labels: ["type: feature", "status: triage"]

body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / Bedarf
      description: Welches Problem soll gelöst werden?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Gewünschte Lösung
      description: Wie soll die Funktion aussehen?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Betroffener Bereich
      options:
        - Konto
        - Login
        - Verwaltung
        - Personen
        - Berechtigungen
        - Einladungen
        - Datenschutz / DSGVO
        - Audit
        - Dokumentation
        - Infrastruktur
        - Sonstiges
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Akzeptanzkriterien
      value: |
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Zusätzliche Hinweise
