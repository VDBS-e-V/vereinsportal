name: Funktion vorschlagen
description: Neue Funktion oder Verbesserung vorschlagen
title: "[Feature]: "
labels: ["type: feature", "status: triage"]

body:
  - type: markdown
    attributes:
      value: |
        Bitte den fachlichen Bedarf beschreiben. Keine echten personenbezogenen Daten als Beispiel verwenden.

  - type: textarea
    id: problem
    attributes:
      label: Problem / Bedarf
      description: Welches reale Problem soll gelöst werden?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Gewünschtes Ergebnis
      description: Welches Verhalten oder Ergebnis wird benötigt?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Betroffener Bereich
      options:
        - Konto / Login
        - Verwaltung
        - Personen
        - Berechtigungen
        - Datenschutz / DSGVO
        - Audit
        - Designsystem / Web Content Library
        - Dokumentation
        - Infrastruktur
        - Sonstiges
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Akzeptanzkriterien
      value: |
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Zusätzliche Hinweise
