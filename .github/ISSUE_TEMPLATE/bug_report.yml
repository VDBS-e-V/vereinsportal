name: Fehler melden
description: Einen reproduzierbaren Fehler im Vereinsportal melden
title: "[Bug]: "
labels: ["type: bug", "status: triage"]

body:
  - type: markdown
    attributes:
      value: |
        Bitte keine Passwörter, Tokens, Session-Cookies oder echten personenbezogenen Daten einfügen.
        Sicherheitslücken bitte über den vertraulichen Security-Meldeweg einreichen.

  - type: textarea
    id: description
    attributes:
      label: Beschreibung
      description: Was ist passiert?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Schritte zur Reproduktion
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Verhalten
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Tatsächliches Verhalten
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Betroffener Bereich
      options:
        - Login / Konto
        - Verwaltung
        - Personen
        - Berechtigungen
        - Datenschutz / DSGVO
        - Audit
        - Designsystem / Web Content Library
        - Datenbank
        - CI / GitHub
        - Deployment
        - Sonstiges
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Umgebung
      description: Zum Beispiel Browser, PHP-Version oder lokales/staging System. Keine Hostnamen mit vertraulichen Daten.
      placeholder: "Firefox 155, PHP 8.5, lokal"

  - type: textarea
    id: logs
    attributes:
      label: Bereinigte Fehlermeldung
      description: Nur notwendige, von Secrets und personenbezogenen Daten bereinigte Ausgabe.
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Vorab geprüft
      options:
        - label: Ich habe keine Secrets oder personenbezogenen Daten eingefügt.
          required: true
        - label: Es handelt sich nicht um eine vertrauliche Sicherheitslücke.
          required: true
        - label: Der Fehler ist reproduzierbar.
