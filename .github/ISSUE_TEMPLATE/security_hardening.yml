name: Sicherheitsmaßnahme
description: Öffentliche Security-Hardening-Aufgabe ohne vertrauliche Schwachstellendetails
title: "[Security]: "
labels: ["type: security", "status: triage"]

body:
  - type: markdown
    attributes:
      value: |
        Dieses Template ist nur für allgemeines Security-Hardening.
        Konkrete oder ausnutzbare Schwachstellen ausschließlich vertraulich über GitHub Security Advisories melden.
        Keine Passwörter, Tokens, personenbezogenen Daten oder Exploit-Details posten.

  - type: textarea
    id: topic
    attributes:
      label: Maßnahme
      description: Welche allgemeine Sicherheitsmaßnahme soll umgesetzt werden?
    validations:
      required: true

  - type: checkboxes
    id: category
    attributes:
      label: Kategorie
      options:
        - label: Authentifizierung
        - label: Autorisierung / Berechtigungen
        - label: CSRF
        - label: Session / Cookies
        - label: Passwort-Reset / Einladungen
        - label: Audit
        - label: Datenschutz / DSGVO
        - label: Dependencies
        - label: GitHub Actions / CI
        - label: Deployment / Server

  - type: textarea
    id: acceptance
    attributes:
      label: Akzeptanzkriterien
      value: |
        - [ ] Umsetzung dokumentiert
        - [ ] automatisierte Tests/QA ergänzt
        - [ ] keine Secrets im Code
        - [ ] keine personenbezogenen Daten in Logs oder Issues
        - [ ] Rollback-/Betriebsauswirkung geprüft
    validations:
      required: true
