name: Deployment-Aufgabe
description: Aufgabe für Staging oder Produktion
title: "[Deploy]: "
labels: ["type: deployment", "status: triage"]

body:
  - type: markdown
    attributes:
      value: |
        Keine Secrets, Zugangsdaten oder internen Schlüssel in dieses Issue einfügen.

  - type: dropdown
    id: environment
    attributes:
      label: Umgebung
      options:
        - Staging
        - Produktion
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Ziel des Deployments
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Vorbedingungen
      options:
        - label: CI erfolgreich
        - label: Security-Checks erfolgreich
        - label: Release/Commit eindeutig festgelegt
        - label: Migrationen geprüft
        - label: APP_DEBUG=0 für Produktion geprüft
        - label: HTTPS aktiv
        - label: Secrets im geschützten Environment vorhanden
        - label: Datenbank-Backup vorhanden
        - label: Health Check definiert
        - label: Rollback-Plan vorhanden

  - type: textarea
    id: rollback
    attributes:
      label: Rollback-Plan
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notizen
