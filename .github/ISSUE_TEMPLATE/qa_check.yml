name: QA-Prüfung
description: Test- oder Abnahmeaufgabe
title: "[QA]: "
labels: ["type: qa", "status: triage"]

body:
  - type: textarea
    id: scope
    attributes:
      label: Prüfumfang
      description: Was soll geprüft werden?
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: `composer qa` erfolgreich
        - label: `composer security` erfolgreich, falls relevant
        - label: `git diff --check` erfolgreich
        - label: Login / Session geprüft, falls betroffen
        - label: Verwaltung / Berechtigungen geprüft, falls betroffen
        - label: Datenschutz / Audit geprüft, falls betroffen
        - label: Designsystem / Responsive-Verhalten geprüft, falls betroffen
        - label: Keine Secrets oder echten personenbezogenen Daten in Logs oder Screenshots

  - type: textarea
    id: result
    attributes:
      label: Ergebnis / Auffälligkeiten
    validations:
      required: true
