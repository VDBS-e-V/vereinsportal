name: Format Issue 50 layout patch

on:
  push:
    branches:
      - feat/issue-50-start-pages
    paths:
      - .github/workflows/issue-50-format-layout.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git init repo
          cd repo
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${BRANCH}"
          git checkout -B "${BRANCH}" FETCH_HEAD

      - name: Normalize Blade PHP indentation
        working-directory: repo
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('resources/views/components/layouts/public.blade.php')
          source = path.read_text()

          replacements = {
              "\n$startRouteNames = [\n    'my.home',\n    'portal.about',\n    'portal.access',\n    'portal.faq',\n    'portal.contact',\n];\n$headerPageTitle = request()->routeIs(...$startRouteNames)\n    ? 'Start'\n    : $pageTitle;\n$documentTitle = $title ?? $pageTitle.' · VDBS Portal';": "\n        $startRouteNames = [\n            'my.home',\n            'portal.about',\n            'portal.access',\n            'portal.faq',\n            'portal.contact',\n        ];\n        $headerPageTitle = request()->routeIs(...$startRouteNames)\n            ? 'Start'\n            : $pageTitle;\n        $documentTitle = $title ?? $pageTitle.' · VDBS Portal';",
              "\n$areaUrl = $areaContext['url'] ?? $homeUrl;\n\nif (request()->routeIs(...$startRouteNames)) {\n    $areaLabel = 'VDBS Portal';\n    $areaUrl = $homeUrl;\n}\n": "\n        $areaUrl = $areaContext['url'] ?? $homeUrl;\n\n        if (request()->routeIs(...$startRouteNames)) {\n            $areaLabel = 'VDBS Portal';\n            $areaUrl = $homeUrl;\n        }\n",
          }

          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit('expected layout block not found')
              source = source.replace(old, new, 1)

          path.write_text(source)
          PY

      - name: Remove temporary workflow and commit
        working-directory: repo
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git rm -f .github/workflows/issue-50-format-layout.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style(portal): tidy start header context'
          git push origin "HEAD:${BRANCH}"
