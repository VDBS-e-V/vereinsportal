name: Issue 50 mockup fetch

on:
  push:
    branches:
      - feat/issue-50-start-pages
    paths:
      - .github/workflows/issue-50-mockup-fetch.yml

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch branch mockups
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git init repo
          cd repo
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${BRANCH}"
          git checkout -B "${BRANCH}" FETCH_HEAD
          cp -a .issue-50-mockups ../mockups

      - name: Upload mockups
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: issue-50-mockups
          path: mockups/
          if-no-files-found: error
          retention-days: 1
