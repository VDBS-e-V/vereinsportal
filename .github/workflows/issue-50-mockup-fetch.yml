name: Issue 50 mockup fetch

on:
  push:
    branches:
      - feat/issue-50-start-pages
    paths:
      - .github/workflows/issue-50-mockup-fetch.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download and commit issue mockups
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git init repo
          cd repo
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${BRANCH}"
          git checkout -B "${BRANCH}" FETCH_HEAD
          mkdir -p .issue-50-mockups
          urls=(
            'ffd5c1d5-7580-4406-a547-cc05ecaf372d'
            'af7c95cc-6a54-4f4d-8de5-569cf08b6a00'
            '07be1171-39fc-4d15-9b97-6c298e301fad'
            '2d761616-5843-4dbe-8a19-9ce1271c8bad'
            'b789e979-6ba7-4f0d-a359-46ac7d778601'
            '02cec0af-abd7-4ef3-9139-608eea66e05c'
            'c76afa83-0c23-4722-ac36-a8ab46a7c4aa'
            '9762b60e-a9cd-43e7-bba0-b785c154dd6e'
          )
          for i in "${!urls[@]}"; do
            n=$((i + 1))
            curl --fail --silent --show-error --location \
              -H "Authorization: token ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github.v3+json' \
              "https://github.com/user-attachments/assets/${urls[$i]}" \
              -o ".issue-50-mockups/${n}.img"
          done
          file .issue-50-mockups/*
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .issue-50-mockups
          git commit -m 'chore: stage issue 50 mockups for review'
          git push origin HEAD:"${BRANCH}"
