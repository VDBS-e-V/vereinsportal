name: Finalize Issue 50 mockup implementation

on:
  push:
    branches:
      - feat/issue-50-start-pages
    paths:
      - .github/workflows/issue-50-mockup-fetch.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git init repo
          cd repo
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${BRANCH}"
          git checkout -B "${BRANCH}" FETCH_HEAD

      - name: Apply Issue 50 page implementation
        working-directory: repo
        run: |
          set -euo pipefail
          cat .issue-50-impl/part* | base64 --decode | tar -xz -C .

      - name: Remove temporary implementation files
        working-directory: repo
        run: |
          set -euo pipefail
          git rm -rf .issue-50-mockups .issue-50-impl
          git rm -f .issue-50-review.pdf .issue-50-review-manifest.txt || true
          git rm -f .github/workflows/issue-50-mockup-fetch.yml

      - name: Commit final Issue 50 implementation
        working-directory: repo
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(portal): match issue 50 reference pages"
          git push origin "HEAD:${BRANCH}"
