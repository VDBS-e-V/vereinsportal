name: Prepare Composer Update

on:
  push:
    branches:
      - fix/ci-stabilization
    paths:
      - .github/workflows/prepare-composer-update.yml

permissions:
  contents: write

jobs:
  composer-update:
    name: Generate and commit Composer lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/ci-stabilization

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_mysql, fileinfo, sodium
          coverage: none
          tools: composer:v2

      - name: Align PHP requirement and add Larastan
        shell: bash
        run: |
          composer require 'php:^8.4.1' --no-update --no-interaction
          composer require --dev 'larastan/larastan:^3.11' --no-update --no-interaction
          composer update larastan/larastan --with-all-dependencies --minimal-changes --no-interaction --no-progress
          composer validate --no-check-publish

      - name: Commit generated Composer files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.json composer.lock
          git diff --cached --quiet && exit 0
          git commit -m 'build: align PHP baseline and add Larastan'
          git push origin HEAD:fix/ci-stabilization
