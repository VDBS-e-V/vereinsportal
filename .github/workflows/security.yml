name: Security

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composer-audit:
    name: Composer Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, fileinfo, sodium
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Audit dependencies
        run: composer audit --locked

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v4

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Scan for common secrets
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path

          root = Path('.')
          patterns = [
              re.compile(r'(AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36,255}|github_pat_[A-Za-z0-9_]{20,})'),
              re.compile(r'(?i)(DB_PASSWORD|APP_KEY|SECRET_KEY)\s*[:=]\s*[^\n]+'),
          ]
          hits = []

          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.suffix.lower() in {'.png', '.jpg', '.jpeg', '.gif', '.svg', '.ico', '.lock'}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8', errors='ignore')
              except Exception:
                  continue
              for pattern in patterns:
                  if pattern.search(text):
                      hits.append(str(path))
                      break

          if hits:
              print('Potential secret-like values detected in:')
              for hit in sorted(set(hits)):
                  print(' - ' + hit)
              sys.exit(1)
          print('No obvious secret-like values detected.')
          PY
